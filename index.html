<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Way Coaching Classes — Your's Success is Our's Target</title>
<link rel="icon" type="image/png" href="images/logo-full.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --navy-950:#0d0d3d;
  --navy-900:#12134f;
  --navy-800:#1b1d6e;
  --navy-700:#262a8c;
  --navy-600:#3438a8;
  --navy-100:#e7e8f7;
  --navy-50:#f3f3fc;
  --yellow-500:#ffd400;
  --yellow-400:#ffdf33;
  --yellow-300:#ffe866;
  --yellow-100:#fff7cf;
  --ink:#101024;
  --paper:#f6f6fb;
  --card:#ffffff;
  --gray-500:#6b6b82;
  --gray-300:#c9c9dc;
  --gray-200:#e3e3ef;
  --green:#1f9d55;
  --red:#e2432a;
  --orange:#e8890c;
  --radius:14px;
  --shadow:0 2px 10px rgba(18,19,79,.06), 0 1px 2px rgba(18,19,79,.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
body{
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--yellow-300);}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:8px;}

#app{display:flex;min-height:100vh;}

.sidebar{
  width:250px;flex-shrink:0;background:linear-gradient(195deg,var(--navy-900),var(--navy-950));
  color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--yellow-500);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy-950);font-size:16px;flex-shrink:0;}
.brand-text{line-height:1.15;}
.brand-text b{font-size:14.5px;letter-spacing:.3px;}
.brand-text span{font-size:10px;color:var(--yellow-400);display:block;text-transform:uppercase;letter-spacing:1px;margin-top:2px;}

.role-switch{display:flex;gap:4px;padding:12px;background:rgba(0,0,0,.15);margin:10px 12px;border-radius:10px;}
.role-switch button{flex:1;background:transparent;border:none;color:rgba(255,255,255,.65);font-size:11.5px;font-weight:600;padding:7px 4px;border-radius:7px;transition:.15s;}
.role-switch button.active{background:var(--yellow-500);color:var(--navy-950);}

.nav-group{padding:8px 10px;}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,.35);padding:12px 10px 4px;font-weight:700;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:13.5px;color:rgba(255,255,255,.82);margin-bottom:2px;transition:.12s;cursor:pointer;}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff;}
.nav-item.active{background:var(--yellow-500);color:var(--navy-950);font-weight:700;}
.nav-icon{width:18px;text-align:center;flex-shrink:0;}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;}
.nav-item.active .nav-badge{background:var(--navy-950);color:#fff;}

.sidebar-footer{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:rgba(255,255,255,.4);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:#fff;border-bottom:1px solid var(--gray-200);padding:14px 26px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;
}
.topbar h1{font-size:19px;margin:0;font-weight:800;color:var(--navy-900);}
.topbar .sub{font-size:12.5px;color:var(--gray-500);margin-top:2px;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.icon-btn{width:36px;height:36px;border-radius:10px;background:var(--navy-50);border:1px solid var(--gray-200);display:flex;align-items:center;justify-content:center;font-size:15px;position:relative;}
.dot{position:absolute;top:5px;right:6px;width:7px;height:7px;background:var(--red);border-radius:50%;border:2px solid #fff;}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--yellow-500);color:var(--navy-950);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}

.content{padding:22px 26px 60px;max-width:1400px;width:100%;margin:0 auto;}

.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:700px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--gray-200);padding:18px;}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.card-head h3{margin:0;font-size:15px;font-weight:800;color:var(--navy-900);}
.card-head .sub{font-size:12px;color:var(--gray-500);margin-top:1px;}

.stat-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--gray-200);padding:16px 18px;position:relative;overflow:hidden;}
.stat-card .top{display:flex;justify-content:space-between;align-items:flex-start;}
.stat-card .ic{width:34px;height:34px;border-radius:9px;background:var(--yellow-100);color:var(--navy-800);display:flex;align-items:center;justify-content:center;font-size:16px;}
.stat-card .val{font-size:25px;font-weight:800;color:var(--navy-950);margin-top:10px;}
.stat-card .lbl{font-size:12.5px;color:var(--gray-500);margin-top:2px;}
.stat-card .trend{font-size:11px;font-weight:700;margin-top:8px;}
.trend.up{color:var(--green);}
.trend.down{color:var(--red);}
.stat-card::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--yellow-500);}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:9px;font-size:13px;font-weight:700;border:1px solid transparent;transition:.12s;white-space:nowrap;}
.btn-primary{background:var(--navy-900);color:#fff;}
.btn-primary:hover{background:var(--navy-800);}
.btn-accent{background:var(--yellow-500);color:var(--navy-950);}
.btn-accent:hover{background:var(--yellow-400);}
.btn-outline{background:#fff;color:var(--navy-900);border-color:var(--gray-300);}
.btn-outline:hover{border-color:var(--navy-700);}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
.btn-ghost{background:transparent;color:var(--navy-700);}
.btn-danger{background:#fdeceb;color:var(--red);}

.quick-actions{display:flex;flex-wrap:wrap;gap:10px;}

.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.badge.blue{background:var(--navy-100);color:var(--navy-800);}
.badge.yellow{background:var(--yellow-100);color:#8a6d00;}
.badge.green{background:#e4f6ea;color:var(--green);}
.badge.red{background:#fdeceb;color:var(--red);}
.badge.gray{background:var(--gray-200);color:var(--gray-500);}
.badge.orange{background:#fdf1e0;color:var(--orange);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--gray-500);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:9px 10px;border-bottom:2px solid var(--gray-200);white-space:nowrap;}
td{padding:11px 10px;border-bottom:1px solid var(--gray-200);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--navy-50);}
.table-wrap{overflow-x:auto;}

/* ---- Monthly Attendance Sheet ---- */
.att-legend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--gray-500);margin:2px 0 14px;}
.att-legend-item{display:flex;align-items:center;gap:6px;}
.att-cell-demo{display:inline-flex;width:20px;height:20px;border-radius:5px;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
.att-cell-demo.att-p{background:#e4f6ea;color:var(--green);}
.att-cell-demo.att-a{background:#fdeceb;color:var(--red);}
.att-cell-demo.att-blank{background:var(--gray-200);}
.att-grid-wrap{border:1px solid var(--gray-200);border-radius:10px;}
table.att-grid{font-size:12px;border-collapse:separate;border-spacing:0;}
table.att-grid th,table.att-grid td{padding:0;border-bottom:1px solid var(--gray-200);border-right:1px solid var(--gray-200);text-align:center;white-space:nowrap;}
table.att-grid thead th{background:var(--navy-900);color:#fff;font-size:10.5px;text-transform:none;letter-spacing:0;padding:6px 4px;border-bottom:1px solid var(--navy-700);border-right:1px solid rgba(255,255,255,.12);}
table.att-grid thead tr:first-child th{padding-top:8px;}
table.att-grid thead tr:last-child th{padding-bottom:8px;}
table.att-grid .att-name-col{position:sticky;left:0;z-index:2;background:var(--navy-900);color:#fff;text-align:left;padding:9px 12px;min-width:170px;}
table.att-grid tbody .att-name-col{background:#fff;color:var(--ink);border-right:2px solid var(--gray-300);}
table.att-grid tbody tr:hover .att-name-col{background:var(--navy-50);}
table.att-grid .att-name-cell{font-weight:700;font-size:12.5px;white-space:normal;}
table.att-grid .att-id{font-weight:500;font-size:10.5px;color:var(--gray-500);margin-top:1px;}
table.att-grid .att-weekend{background:var(--navy-100);}
table.att-grid thead .att-weekend{background:var(--navy-700);}
table.att-grid tbody tr:nth-child(even) td:not(.att-name-col){background:var(--navy-50);}
table.att-grid tbody tr:nth-child(even) td.att-weekend{background:var(--navy-100);}
.att-col-btn{border:none;background:transparent;color:#fff;font-weight:700;font-size:11px;padding:4px 6px;border-radius:5px;cursor:pointer;}
.att-col-btn:hover{background:rgba(255,255,255,.18);}
.att-cell{width:28px;height:28px;border:none;background:transparent;border-radius:5px;font-weight:800;font-size:11px;cursor:pointer;color:var(--gray-500);}
.att-cell.att-p{background:#e4f6ea;color:var(--green);}
.att-cell.att-a{background:#fdeceb;color:var(--red);}
.att-cell.att-blank:hover{background:var(--gray-200);}
.att-note{font-size:11.5px;color:var(--gray-500);margin-top:12px;}
.att-sheet-card{overflow-x:auto;}

.list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--gray-200);flex-wrap:wrap;}
.list-row:last-child{border-bottom:none;}
.list-icon{width:36px;height:36px;border-radius:9px;background:var(--navy-50);color:var(--navy-800);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;font-weight:700;}

.tabs{display:flex;gap:4px;background:var(--navy-50);border-radius:10px;padding:4px;margin-bottom:18px;width:fit-content;flex-wrap:wrap;}
.tab-btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;color:var(--gray-500);border:none;background:transparent;}
.tab-btn.active{background:#fff;color:var(--navy-900);box-shadow:var(--shadow);}

.progress-bar{height:9px;background:var(--gray-200);border-radius:20px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--navy-700),var(--yellow-500));border-radius:20px;}

.section-title{font-size:20px;font-weight:800;color:var(--navy-950);margin:0 0 4px;}
.section-desc{font-size:13px;color:var(--gray-500);margin:0 0 18px;}

.input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--gray-300);border-radius:8px;font-size:13px;background:#fff;color:var(--ink);font-family:inherit;}
.input:focus,select:focus,textarea:focus{outline:2px solid var(--yellow-500);border-color:var(--navy-700);}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--navy-900);margin-bottom:5px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
@media(max-width:700px){.form-grid{grid-template-columns:1fr;}}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:6px 12px;border-radius:20px;background:var(--navy-50);border:1px solid var(--gray-200);font-size:12px;font-weight:600;color:var(--navy-800);}

.alert-box{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:10px;background:#fdf1e0;border:1px solid #f5dcae;margin-bottom:12px;}
.alert-box.red{background:#fdeceb;border-color:#f6cac3;}
.alert-box .ic{font-size:18px;}
.alert-box b{color:var(--navy-950);}

.modal-overlay{position:fixed;inset:0;background:rgba(13,13,61,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:560px;width:100%;max-height:85vh;overflow-y:auto;}
.modal h3{margin:0 0 4px;font-size:17px;color:var(--navy-950);}
.modal .close{float:right;cursor:pointer;font-size:20px;color:var(--gray-500);}

.avatar-lg{width:88px;height:88px;border-radius:18px;background:var(--yellow-500);color:var(--navy-950);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:30px;flex-shrink:0;}

.msg-bubble{padding:12px 14px;border-radius:12px;background:var(--navy-50);margin-bottom:10px;max-width:80%;}
.msg-bubble.sent{background:var(--navy-900);color:#fff;margin-left:auto;}
.msg-meta{font-size:10.5px;color:var(--gray-500);margin-top:4px;}
.msg-bubble.sent .msg-meta{color:rgba(255,255,255,.6);}

.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-cell{aspect-ratio:1;border-radius:8px;background:var(--navy-50);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--navy-800);position:relative;padding:4px;}
.cal-cell.holiday{background:#fdeceb;color:var(--red);}
.cal-cell.exam{background:var(--yellow-100);color:#8a6d00;}

.empty-state{text-align:center;padding:40px 20px;color:var(--gray-500);}
.empty-state .ic{font-size:34px;margin-bottom:10px;}

.hamburger{display:none;background:none;border:none;font-size:20px;color:var(--navy-900);}
@media(max-width:900px){
  .sidebar{position:fixed;left:-260px;top:0;z-index:200;transition:.2s;box-shadow:0 0 40px rgba(0,0,0,.3);}
  .sidebar.open{left:0;}
  .hamburger{display:block;}
  .content{padding:16px;}
}
.brand-logo-img{height:46px;width:auto;display:block;background:#fff;border-radius:10px;padding:5px 10px;}

/* ---- General micro-animations ---- */
@keyframes contentFadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.content{animation:contentFadeIn .35s ease both;}
.card,.stat-card{transition:transform .18s ease,box-shadow .18s ease;}
.card:hover,.stat-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(18,19,79,.10);}
.nav-item{transition:background .15s ease,transform .15s ease,color .15s ease;}
.nav-item:hover{transform:translateX(3px);}
.btn{transition:transform .14s ease,box-shadow .14s ease,background .14s ease;}
.btn:active{transform:scale(.96);}
.btn-primary:hover,.btn-accent:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(13,13,61,.18);}
.list-row{transition:background .15s ease;}
.list-row:hover{background:var(--navy-50);border-radius:8px;}
.avatar,.brand-logo-img{transition:transform .2s ease;}
.avatar:hover{transform:scale(1.06);}
.progress-fill{transition:width .6s cubic-bezier(.22,1,.36,1);}
@keyframes badgePop{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
.badge{animation:badgePop .25s ease both;}
.modal{animation:contentFadeIn .25s ease both;}
.modal-overlay{animation:lpFadeOverlay .2s ease both;}
@keyframes lpFadeOverlay{from{opacity:0;}to{opacity:1;}}
.sidebar .nav-group{animation:contentFadeIn .4s ease both;}
#toast{animation:toastRise .3s ease both;}
@keyframes toastRise{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

/* ---- Icon image sizing across contexts ---- */
.ic-img{width:16px;height:16px;object-fit:contain;vertical-align:middle;display:inline-block;margin-bottom:2px;}
.nav-icon .ic-img{width:16px;height:16px;margin-bottom:0;}
.list-icon .ic-img{width:19px;height:19px;margin-bottom:0;}
.stat-card .ic .ic-img{width:19px;height:19px;margin-bottom:0;}
.icon-btn .ic-img{width:16px;height:16px;margin-bottom:0;}
.btn .ic-img{width:14px;height:14px;margin-bottom:0;}
.lp-why-card .ic .ic-img{width:26px;height:26px;margin-bottom:0;}
.lp-eyebrow .ic-img{width:14px;height:14px;margin-right:2px;margin-bottom:0;}
.lp-milestone .ic-img{width:15px;height:15px;margin-right:3px;margin-bottom:0;}
.empty-state .ic .ic-img{width:30px;height:30px;margin-bottom:0;}
.alert-box .ic .ic-img{width:18px;height:18px;margin-bottom:0;}
h3 .ic-img,.card-head .ic-img{width:16px;height:16px;margin-bottom:0;}
.logout-btn{width:36px;height:36px;border-radius:10px;background:#fdeceb;border:1px solid #f6cac3;color:var(--red);display:flex;align-items:center;justify-content:center;font-size:15px;}

/* ============================================================
   PUBLIC SITE (Landing + Login)
   ============================================================ */
.lp{--lp-navy:#0d0d3d;--lp-navy2:#151760;--lp-yellow:#ffd400;font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;color:#151735;background:#fbfbfe;overflow-x:hidden;}
.lp h1,.lp h2,.lp h3,.lp .lp-display{font-family:'Sora',sans-serif;}
.lp a{color:inherit;}
.lp section{position:relative;}
.lp .wrap{max-width:1180px;margin:0 auto;padding:0 28px;}
@keyframes lpFadeUp{from{opacity:0;transform:translateY(26px);}to{opacity:1;transform:translateY(0);}}
.lp-reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease;}
.lp-reveal.in-view{opacity:1;transform:translateY(0);}
.lp-reveal.d1{transition-delay:.08s;}.lp-reveal.d2{transition-delay:.16s;}.lp-reveal.d3{transition-delay:.24s;}.lp-reveal.d4{transition-delay:.32s;}

/* --- Header --- */
.lp-header{position:fixed;top:0;left:0;right:0;z-index:500;padding:16px 0;transition:.25s;}
.lp-header .wrap{display:flex;align-items:center;justify-content:space-between;}
.lp-header-inner{display:flex;align-items:center;gap:12px;}
.lp-header.scrolled{background:rgba(13,13,61,.92);backdrop-filter:blur(10px);box-shadow:0 4px 24px rgba(0,0,0,.18);padding:10px 0;}
.lp-logo{display:flex;align-items:center;gap:10px;}
.lp-logo img{height:44px;width:auto;background:#fff;border-radius:9px;padding:4px 9px;transition:.25s;}
.lp-header.scrolled .lp-logo img{height:36px;}
.lp-nav{display:flex;align-items:center;gap:30px;}
.lp-nav a{font-size:14px;font-weight:600;color:#fff;opacity:.82;position:relative;padding:4px 0;}
.lp-nav a::after{content:"";position:absolute;left:0;bottom:-2px;width:0;height:2px;background:var(--lp-yellow,#ffd400);transition:.25s;}
.lp-nav a:hover{opacity:1;}
.lp-nav a:hover::after{width:100%;}
.lp-portal-btn{background:var(--lp-yellow,#ffd400);color:var(--lp-navy,#0d0d3d);font-weight:800;font-size:13.5px;padding:10px 20px;border-radius:30px;border:none;letter-spacing:.2px;box-shadow:0 6px 18px rgba(255,212,0,.25);}
.lp-portal-btn:hover{background:#fff;}
.lp-burger{display:none;background:none;border:none;color:#fff;font-size:22px;}
@media(max-width:860px){.lp-nav{position:fixed;top:0;right:-100%;width:78%;max-width:320px;height:100vh;background:var(--lp-navy,#0d0d3d);flex-direction:column;justify-content:center;gap:26px;transition:.3s;}
  .lp-nav.open{right:0;}.lp-nav a{font-size:16px;}.lp-burger{display:block;}}

/* --- Hero --- */
.lp-hero{min-height:100vh;background:radial-gradient(120% 90% at 15% 0%,#1c1e78 0%,var(--lp-navy,#0d0d3d) 55%,#08082a 100%);color:#fff;display:flex;align-items:center;padding:130px 0 80px;overflow:hidden;}
.lp-hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;position:relative;z-index:2;}

.lp-hero h1{font-size:46px;line-height:1.12;font-weight:800;margin:0 0 18px;letter-spacing:-.5px;}
.lp-hero h1 em{font-style:normal;color:var(--lp-yellow,#ffd400);}
.lp-hero p.lead{font-size:16px;line-height:1.7;color:rgba(255,255,255,.72);max-width:480px;margin:0 0 30px;}
.lp-btn-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:42px;}
.lp-btn{padding:14px 26px;border-radius:32px;font-weight:800;font-size:14px;border:none;display:inline-flex;align-items:center;gap:8px;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;}

.lp-btn-outline{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.35);}
.lp-btn-outline:hover{border-color:#fff;transform:translateY(-3px);}
.lp-portal-btn{transition:transform .18s ease,background .18s ease;}

/* --- Road signature visual --- */
.lp-road-wrap{position:relative;height:480px;}
.lp-road-wrap svg{width:100%;height:100%;overflow:visible;}
.lp-road-path{fill:none;stroke:#12134f;stroke-width:46;stroke-linecap:round;}
.lp-road-edge{fill:none;stroke:rgba(255,255,255,.18);stroke-width:48;stroke-linecap:round;}
.lp-road-lane{fill:none;stroke:var(--lp-yellow,#ffd400);stroke-width:5;stroke-linecap:round;stroke-dasharray:16 18;animation:lpDash 1.6s linear infinite;}
@keyframes lpDash{to{stroke-dashoffset:-68;}}
.lp-cap{transform-origin:center;animation:lpBob 3s ease-in-out infinite;}
@keyframes lpBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.lp-milestone{position:absolute;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);border-radius:12px;padding:10px 14px;font-size:12px;font-weight:700;color:#fff;animation:lpFloat 6s ease-in-out infinite;}

/* ================= LOCAL PERSISTENCE =================
   Saves DB (students, batches, attendance, fees...) to the browser's
   localStorage so records survive a page refresh or closing the tab.
   This is a stopgap for real, cross-device storage — see the note above
   PAGES for how to wire this up to a real backend/database instead. */
const PERSIST_KEY='nwc_db_v1';
function persist(){
  try{ localStorage.setItem(PERSIST_KEY, JSON.stringify({DB, nextStudentSeq})); }
  catch(err){ console.warn('Could not save to localStorage', err); }
}
function loadPersisted(){
  try{
    const raw=localStorage.getItem(PERSIST_KEY);
    if(!raw) return;
    const saved=JSON.parse(raw);
    if(saved && saved.DB){ Object.keys(saved.DB).forEach(k=>{ DB[k]=saved.DB[k]; }); }
    if(saved && typeof saved.nextStudentSeq==='number'){ nextStudentSeq=saved.nextStudentSeq; }
  }catch(err){ console.warn('Could not load saved data', err); }
}

function chartColors(){return {navy:'#1b1d6e',navy2:'#3438a8',yellow:'#ffd400',gray:'#c9c9dc'};}
function drawAnalyticsCharts(){
  const c=chartColors();
  const mk=(id,cfg)=>{const el=document.getElementById(id);if(!el)return;if(el._chart){el._chart.destroy();}el._chart=new Chart(el,cfg);};
  mk('chartMarks',{type:'line',data:{labels:['Test1','Test2','Test3','Test4','Test5'],datasets:[{label:'Marks %',data:[62,68,74,71,88],borderColor:c.navy,backgroundColor:'rgba(27,29,110,.08)',tension:.35,fill:true,pointBackgroundColor:c.yellow}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max:100}}}});
  mk('chartSubject',{type:'bar',data:{labels:['Mathematics','Science','English','Hindi'],datasets:[{label:'Avg %',data:[81,74,88,79],backgroundColor:[c.navy,c.navy2,c.yellow,'#8a8fd6']}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max:100}}}});
  mk('chartAttPerf',{type:'scatter',data:{datasets:[{label:'Students',data:DB.students.map(s=>({x:s.attendance,y:s.lastTest})),backgroundColor:c.navy}]},options:{scales:{x:{title:{display:true,text:'Attendance %'}},y:{title:{display:true,text:'Test Marks'}}}}});
  mk('chartTrend',{type:'line',data:{labels:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'],datasets:[{label:'Class Average',data:[64,66,70,69,72,75,77,79],borderColor:c.yellow,backgroundColor:'rgba(255,212,0,.15)',fill:true,tension:.3}]},options:{plugins:{legend:{display:false}}}});
}

function addBatch(){
  const el=document.getElementById('newBatchName');
  const name=(el&&el.value||'').trim();
  if(!name){toast('Enter a batch name first');return;}
  if(DB.batches.some(b=>b.toLowerCase()===name.toLowerCase())){toast('That batch already exists');return;}
  DB.batches.push(name);
  if(el) el.value='';
  persist();
  render();
  toast('Batch "'+name+'" created');
}
function renameBatch(oldName){
  const next=(prompt('Rename "'+oldName+'" to:',oldName)||'').trim();
  if(!next||next===oldName) return;
  if(DB.batches.some(b=>b.toLowerCase()===next.toLowerCase())){toast('A batch with that name already exists');return;}
  const i=DB.batches.indexOf(oldName);
  if(i>-1) DB.batches[i]=next;
  DB.students.forEach(s=>{ if(s.batches){ s.batches=s.batches.map(b=>b===oldName?next:b); } });
  persist();
  render();
  toast('Batch renamed to "'+next+'"');
}
function deleteBatch(name){
  const inUse=DB.students.filter(s=>(s.batches||[]).includes(name)).length;
  if(inUse>0 && !confirm(inUse+' student(s) are currently in "'+name+'". Delete this batch and remove it from their records?')) return;
  DB.batches=DB.batches.filter(b=>b!==name);
  DB.students.forEach(s=>{ if(s.batches) s.batches=s.batches.filter(b=>b!==name); });
  persist();
  render();
  toast('Batch "'+name+'" deleted');
}
function removeStudent(idx){

}

/* ================= ATTENDANCE (MONTHLY SHEET) ================= */
function attKey(batch,date){return batch+"|"+date;}
function getAttendanceMap(batch,date){
  const k=attKey(batch,date);
  if(!DB.attendanceRecords[k]) DB.attendanceRecords[k]={};
  return DB.attendanceRecords[k];
}
function selectAttendanceBatch(batch){state.attendanceBatch=batch;render();}
function backToBatchPicker(){state.attendanceBatch=null;render();}
function setAttendanceMonth(v){ if(v) state.attendanceMonth=v; render(); }
function shiftAttendanceMonth(delta){
  const [y,m]=state.attendanceMonth.split('-').map(Number);
  const d=new Date(y,m-1+delta,1);
  state.attendanceMonth=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0');
  render();
}
function daysInMonth(ym){
  const [y,m]=ym.split('-').map(Number);
  return new Date(y,m,0).getDate();
}
function dateForDay(ym,day){ return ym+"-"+String(day).padStart(2,'0'); }
function cycleAttendanceCell(studentId,day){
  const date=dateForDay(state.attendanceMonth,day);
  const map=getAttendanceMap(state.attendanceBatch,date);
  const cur=map[studentId]||'';
  map[studentId]= cur===''?'Present':(cur==='Present'?'Absent':'');
  persist();
  render();
}
function markColumnAttendance(day,status){
  const date=dateForDay(state.attendanceMonth,day);
  const map=getAttendanceMap(state.attendanceBatch,date);
  const students=DB.students.filter(s=>(s.batches||[]).includes(state.attendanceBatch));
  students.forEach(s=>{map[s.id]=status;});
  persist();
  render();
}
function formatDateNice(iso){
  const d=new Date(iso+"T00:00:00");
  return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
}
function monthLabel(ym){
  const [y,m]=ym.split('-').map(Number);
  return new Date(y,m-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});
}
function renderAttendanceTaking(){
  if(!state.attendanceBatch){
    return `
    ${pageHeader("Take Attendance","Choose a batch to open its monthly attendance sheet.")}
    <div class="grid grid-3">
      ${DB.batches.length?DB.batches.map(batch=>{
        const count=DB.students.filter(s=>(s.batches||[]).includes(batch)).length;
        return `<div class="card" style="cursor:pointer;text-align:center;padding:26px 16px;" onclick="selectAttendanceBatch('${batch.replace(/'/g,"\\'")}')">
          <div style="width:52px;height:52px;border-radius:14px;background:var(--navy-100);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;"><img src='images/school.png' class='ic-img' alt='' style="width:26px;height:26px;"></div>
          <div style="font-weight:800;font-size:16px;color:var(--navy-950);">${batch}</div>
          <div style="font-size:12.5px;color:var(--gray-500);margin-top:4px;">${count} student${count===1?'':'s'}</div>
        </div>`;
      }).join(''):`<div class="empty-state"><div class="ic"><img src='images/school.png' class='ic-img' alt=''></div>No batches yet. Create one under "Manage Batches" first.</div>`}
    </div>`;
  }
  const batch=state.attendanceBatch;
  const ym=state.attendanceMonth;
  const nDays=daysInMonth(ym);
  const [yy,mm]=ym.split('-').map(Number);
  // Students sorted alphabetically by name (A → Z)
  const students=DB.students.filter(s=>(s.batches||[]).includes(batch)).slice().sort((a,b)=>a.name.localeCompare(b.name));
  const dayCols=Array.from({length:nDays},(_,i)=>i+1).map(day=>{
    const dow=new Date(yy,mm-1,day).getDay(); // 0=Sun..6=Sat
    const letters=['S','M','T','W','T','F','S'];
    return {day,letter:letters[dow],weekend:dow===0||dow===6};
  });
  let totalPresent=0,totalAbsent=0,totalMarked=0;
  students.forEach(s=>{
    dayCols.forEach(c=>{
      const st=(DB.attendanceRecords[attKey(batch,dateForDay(ym,c.day))]||{})[s.id]||'';
      if(st==='Present'){totalPresent++;totalMarked++;}
      else if(st==='Absent'){totalAbsent++;totalMarked++;}
    });
  });
  return `
  ${pageHeader(batch+" — Monthly Attendance Sheet","Click a cell to mark Present, click again for Absent, once more to clear.")}
  <div class="card" style="margin-bottom:16px;">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
      <button class="btn btn-outline btn-sm" onclick="backToBatchPicker()">← Choose Different Batch</button>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-outline btn-sm" onclick="shiftAttendanceMonth(-1)">‹ Prev</button>
        <input type="month" class="input" style="width:auto;" value="${ym}" onchange="setAttendanceMonth(this.value)">
        <button class="btn btn-outline btn-sm" onclick="shiftAttendanceMonth(1)">Next ›</button>
      </div>
    </div>
  </div>
  <div class="grid grid-3" style="margin-bottom:16px;">
    ${statCard("<img src='images/graduate-avatar.png' class='ic-img' alt=''>","Total Students",students.length,"")}
    ${statCard("<img src='images/check.png' class='ic-img' alt=''>","Present Marks",totalPresent,"")}
    ${statCard("<img src='images/clock (1).png' class='ic-img' alt=''>","Absent Marks",totalAbsent,"")}
  </div>
  <div class="card att-sheet-card">
    <div class="card-head"><div><h3>${monthLabel(ym)}</h3><div class="sub">${batch} · ${students.length} student${students.length===1?'':'s'} · sorted alphabetically</div></div></div>
    ${students.length?`
    <div class="att-legend">
      <span class="att-legend-item"><span class="att-cell-demo att-p">P</span> Present</span>
      <span class="att-legend-item"><span class="att-cell-demo att-a">A</span> Absent</span>
      <span class="att-legend-item"><span class="att-cell-demo att-blank"></span> Not marked</span>
    </div>
    <div class="table-wrap att-grid-wrap">
      <table class="att-grid">
        <thead>
          <tr>
            <th class="att-name-col" rowspan="2">Student Name</th>
            ${dayCols.map(c=>`<th class="att-day-letter ${c.weekend?'att-weekend':''}">${c.letter}</th>`).join('')}
          </tr>
          <tr>
            ${dayCols.map(c=>`<th class="att-day-num ${c.weekend?'att-weekend':''}"><button class="att-col-btn" title="Mark all Present for ${c.day}" onclick="markColumnAttendance(${c.day},'Present')">${c.day}</button></th>`).join('')}
          </tr>
        </thead>
        <tbody>
        ${students.map(s=>{
          const cells=dayCols.map(c=>{
            const st=(DB.attendanceRecords[attKey(batch,dateForDay(ym,c.day))]||{})[s.id]||'';
            const cls= st==='Present'?'att-p':(st==='Absent'?'att-a':'att-blank');
            const label= st==='Present'?'P':(st==='Absent'?'A':'');
            return `<td class="${c.weekend?'att-weekend':''}"><button class="att-cell ${cls}" onclick="cycleAttendanceCell('${s.id}',${c.day})">${label}</button></td>`;
          }).join('');
          return `<tr><td class="att-name-col att-name-cell">${s.name}<div class="att-id">${s.id}</div></td>${cells}</tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>
    <div class="att-note">Attendance is saved automatically as you click each cell.</div>
    `:`<div class="empty-state"><div class="ic"><img src='images/graduate-avatar.png' class='ic-img' alt=''></div>No students found in this batch yet.</div>`}
  </div>`;
}

    addStudent:{title:"Add New Student",body:`<div class="form-grid">
        <div class="field"><label>Student Name</label><input id="nsName" class="input" placeholder="e.g. Ishaan Gupta"></div>
        <div class="field"><label>Class</label><select id="nsClass" class="input"><option>Class 8</option><option>Class 9</option><option selected>Class 10</option><option>Class 11</option><option>Class 12</option></select></div>
      </div>
      <div class="field"><label>Batches (select one or more)</label>${batchCheckboxList('nsBatch',[])}</div>
      <div class="form-grid">
        <div class="field"><label>Parent / Guardian Name</label><input id="nsParent" class="input" placeholder="e.g. Suresh Gupta"></div>
        <div class="field"><label>Parent Phone</label><input id="nsPhone" class="input" placeholder="+91 XXXXX XXXXX"></div>
        <div class="field"><label>Student ID</label><input class="input" value="Auto-generated on save" disabled style="color:var(--gray-500);"></div>
      </div>`,action:"Add Student",custom:"addStudentSubmit()"},
    editStudent:{title:"Edit Student — "+name,body:(()=>{const s=DB.students.find(x=>x.id===name)||{};return `<div class="form-grid">
        <div class="field"><label>Student Name</label><input id="esName" class="input" value="${s.name||''}"></div>
        <div class="field"><label>Class</label><select id="esClass" class="input">${["Class 8","Class 9","Class 10","Class 11","Class 12"].map(c=>`<option ${s.cls===c?'selected':''}>${c}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>Batches (select one or more)</label>${batchCheckboxList('esBatch',s.batches||[])}</div>
      <div class="form-grid">
        <div class="field"><label>Parent / Guardian Name</label><input id="esParent" class="input" value="${s.parent&&s.parent!=='—'?s.parent:''}"></div>
        <div class="field"><label>Parent Phone</label><input id="esPhone" class="input" value="${s.phone&&s.phone!=='—'?s.phone:''}"></div>
        <div class="field"><label>Student ID</label><input class="input" value="${s.id||''}" disabled style="color:var(--gray-500);"></div>
      </div>`;})(),action:"Save Changes",custom:"editStudentSubmit('"+name+"')"},
  };
  return templates[m.type]||{title:"",body:"",action:"Save"};
}
function batchCheckboxList(prefix,selected){
  if(!DB.batches.length) return `<div style="font-size:12.5px;color:var(--gray-500);">No batches yet — create one under "Manage Batches" first.</div>`;
  return `<div style="display:flex;flex-wrap:wrap;gap:12px;padding:10px 12px;border:1px solid var(--navy-100);border-radius:10px;">
    ${DB.batches.map(b=>{
      const cid=prefix+'_'+b.replace(/[^a-zA-Z0-9]/g,'');
      return `<label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none;">
        <input type="checkbox" id="${cid}" ${selected.includes(b)?'checked':''} style="width:16px;height:16px;accent-color:var(--navy-800);">${b}
      </label>`;
    }).join('')}
  </div>`;
}
function openModal(type,arg){state.modal={type,arg};render();}
function closeModal(){state.modal=null;render();}
function submitModal(){
  const t=modalContent(state.modal);
  if(t.custom){ (new Function(t.custom))(); return; }
  toast('Saved successfully');closeModal();
}

/* ================= TOAST ================= */
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy-950);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;box-shadow:0 6px 20px rgba(0,0,0,.25);';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(()=>{t.style.transition='opacity .4s';t.style.opacity='0';},1800);
}

/* ================= PAGE ROUTER ================= */
const PAGES={
  dash:renderTeacherDash, profile:renderProfile, classes:renderClasses, planner:renderPlanner,
  syllabus:renderSyllabus, materials:renderMaterials, tests:renderTests, qbank:renderQBank,
  marks:renderMarks, analytics:renderAnalytics, rank:renderRank, attention:renderAttention,
  remarks:renderRemarks, attendanceAlerts:renderAttendanceAlerts, leave:renderLeaveTeacher, comm:renderComm,
  parentDash:renderParentDash, parentAttendance:renderParentAttendance, parentHomework:renderParentHomework,
  parentResults:renderParentResults, parentReport:renderParentReport, parentFees:renderParentFees,
  parentTimetable:renderParentTimetable, parentNotices:renderParentNotices, parentLeave:renderParentLeave,
  parentMsg:renderParentMsg, parentRemarks:renderParentRemarks,
  admission:renderAdmission, enquiry:renderEnquiry, adminLeave:renderAdminLeave, holiday:renderHoliday,
  adminAttendance:renderAdminAttendance, studentMgmt:renderStudentMgmt, feeMgmt:renderFeeMgmt,

  leave:["Leave Requests","Approve student leave applications"],comm:["Announcements","Message parents directly"],
  parentDash:["Parent Dashboard","Your child's overview"],parentAttendance:["Attendance",""],parentHomework:["Homework",""],
  parentResults:["Test Results",""],parentReport:["Performance Report",""],parentFees:["Fees",""],
  parentTimetable:["Timetable",""],parentNotices:["Notices",""],parentLeave:["Apply for Leave",""],
  parentMsg:["Messages",""],parentRemarks:["Teacher Remarks",""],
  admission:["Admission Management","Applications & new enrollments"],enquiry:["Enquiries","Lead tracking & follow-ups"],

/* ================= MAIN RENDER ================= */
function render(){
  const app=document.getElementById('app');

  if(!state.authed){
    app.innerHTML = state.view==='login' ? renderLogin() : renderLanding();
    if(state.view==='landing'){ initLandingEffects(); }
    return;
  }

  if(!NAV[state.role].some(g=>g.items.some(i=>i.id===state.page))){
    state.page=DEFAULT_PAGE[state.role];
  }
  const roleLabel={teacher:"Teacher",parent:"Parent",admin:"Admin"};
  const initials={teacher:"AS",parent:"RV",admin:"AD"}[state.role];
  const title=PAGE_TITLES[state.page]?PAGE_TITLES[state.page][0]:"";

  app.innerHTML=`
  <div class="sidebar ${state.sidebarOpen?'open':''}">
    <div class="brand"><img class="brand-logo-img" src="images/logo-full.png" alt="New Way Coaching Classes"></div>
    <div class="role-switch">
      ${["teacher","parent","admin"].map(r=>`<button class="${state.role===r?'active':''}" onclick="switchRole('${r}')">${roleLabel[r]}</button>`).join('')}
    </div>
    ${NAV[state.role].map(g=>`
      <div class="nav-group">
        <div class="nav-label">${g.group}</div>
        ${g.items.map(it=>`<div class="nav-item ${state.page===it.id?'active':''}" onclick="goPage('${it.id}')">
          <span class="nav-icon">${it.icon}</span><span>${it.label}</span>${it.badge?`<span class="nav-badge">${it.badge}</span>`:''}
        </div>`).join('')}
      </div>`).join('')}
    <div class="sidebar-footer">© 2026 New Way Coaching Classes<br>Institute Management System v1.0</div>
  </div>
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <div><h1>${title}</h1><div class="sub">${PAGE_TITLES[state.page]?PAGE_TITLES[state.page][1]:''}</div></div>
      </div>
      <div class="topbar-right">
        <button class="btn btn-outline btn-sm" onclick="goLanding()"><img src='images/house.png' class='ic-img' alt=''> View Website</button>
        <div class="icon-btn"><img src='images/clock (1).png' class='ic-img' alt=''><span class="dot"></span></div>
        <div class="avatar" title="${CREDENTIALS[state.role]?CREDENTIALS[state.role].name:''}">${initials}</div>
        <button class="logout-btn" title="Logout" onclick="logout()">⏻</button>
      </div>
    </div>
    <div class="content">${(PAGES[state.page]||renderTeacherDash)()}</div>
  </div>
  ${state.modal?renderModal():''}
  `;
}
function renderModal(){
  const t=modalContent(state.modal);
  return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal"><span class="close" onclick="closeModal()">&times;</span><h3>${t.title}</h3><div style="margin-top:14px;">${t.body}</div>
    <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end;"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-accent" onclick="submitModal()">${t.action}</button></div></div>
  </div>`;
}
function goPage(p){state.page=p;state.sidebarOpen=false;render();window.scrollTo(0,0);}
function switchRole(r){state.role=r;state.page=DEFAULT_PAGE[r];state.sidebarOpen=false;render();}
function toggleSidebar(){state.sidebarOpen=!state.sidebarOpen;render();}

/* ================= PUBLIC SITE: NAV / AUTH ================= */
function goLanding(){state.authed=false;state.view='landing';state.loginError='';window.scrollTo(0,0);render();}
function goLogin(role){state.view='login';state.loginRole=role||'admin';state.loginError='';window.scrollTo(0,0);render();}
function setLoginRole(r){state.loginRole=r;state.loginError='';render();}
function logout(){state.authed=false;state.view='landing';state.page='dash';toast('Logged out successfully');window.scrollTo(0,0);render();}
function tryLogin(e){
  if(e&&e.preventDefault)e.preventDefault();
  const u=(document.getElementById('loginUser').value||'').trim();
  const p=(document.getElementById('loginPass').value||'').trim();
  const role=state.loginRole;
  const cred=CREDENTIALS[role];
  if(cred && u.toLowerCase()===cred.username && p===cred.password){
    state.authed=true;state.role=role;state.page=DEFAULT_PAGE[role];state.loginError='';
    window.scrollTo(0,0);render();
    toast('Welcome back, '+cred.name+'!');
  }else{
    state.loginError='Incorrect username or password for the selected portal.';
    render();
  }
  return false;
}
function enquirySubmit(e){
  if(e&&e.preventDefault)e.preventDefault();
  toast("Thanks! Our counsellor will call you shortly.");
  const f=document.getElementById('enquiryForm');
  if(f)f.reset();
  return false;
}

/* ================= LANDING PAGE EFFECTS ================= */
function initLandingEffects(){
  // Reveal-on-scroll is set up FIRST and defensively, so content can never
  // get stuck invisible even if something else below throws an error.
  try{
    const reveal=document.querySelectorAll('.lp-reveal');
    if('IntersectionObserver' in window){
      const io=new IntersectionObserver((entries)=>{
        entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in-view'); io.unobserve(en.target); } });
      },{threshold:0.1,rootMargin:'0px 0px -40px 0px'});
      reveal.forEach(el=>io.observe(el));
    } else {
      reveal.forEach(el=>el.classList.add('in-view'));
    }
    // Safety net: if for any reason an element never gets flagged in-view
    // (slow layout, missed intersection, etc.) force it visible so the
    // page never shows blank/white sections.
    setTimeout(()=>reveal.forEach(el=>el.classList.add('in-view')), 1800);
  }catch(err){
    document.querySelectorAll('.lp-reveal').forEach(el=>el.classList.add('in-view'));
  }
  try{
    const header=document.querySelector('.lp-header');
    const onScroll=()=>{ if(header) header.classList.toggle('scrolled', window.scrollY>30); };
    window.addEventListener('scroll',onScroll);
    onScroll();
  }catch(err){}
}
function toggleLpNav(){
  const nav=document.querySelector('.lp-nav');
  if(nav)nav.classList.toggle('open');
}
function lpNavClose(){const nav=document.querySelector('.lp-nav');if(nav)nav.classList.remove('open');}

render();
</script>
